name: kolog_backend

services:
  kolog_backend:
    build:
      context: ${BUILD_CONTEXT:-..}
      dockerfile: deploy/Dockerfile
    image: kolog_backend:${IMAGE_TAG:?IMAGE_TAG must be set to an immutable build tag}
    container_name: kolog_backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8001}:8080"
    volumes:
      - kolog_backend_storage_data:/app/storage
    networks:
      - kolog_backend_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/v1/logs/hours"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kolog
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - kolog-db-data:/var/lib/postgresql/data
    networks:
      - kolog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  kolog_backend_network:
    name: kolog_backend_network
    driver: bridge

volumes:
  kolog-storage:
  kolog-db-data:
