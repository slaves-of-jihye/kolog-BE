name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  kolog_backend:
    build:
      context: ${BUILD_CONTEXT:?BUILD_CONTEXT is required}
      dockerfile: deploy/Dockerfile
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${IMAGE_TAG:?IMAGE_TAG must be set to an immutable build tag}
    container_name: ${CONTAINER_NAME:?CONTAINER_NAME is required}
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:?APP_PORT is required}"
    volumes:
      - kolog-storage:/app/storage
    networks:
      - kolog-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "${HEALTHCHECK_URL:?HEALTHCHECK_URL is required}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kolog
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - kolog-db-data:/var/lib/postgresql/data
    networks:
      - kolog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  kolog-network:
    name: ${NETWORK_NAME:?NETWORK_NAME is required}
    driver: bridge

volumes:
  kolog-storage:
    name: ${STORAGE_VOLUME_NAME:?STORAGE_VOLUME_NAME is required}
  kolog-db-data:
    name: ${DB_VOLUME_NAME:?DB_VOLUME_NAME is required}
