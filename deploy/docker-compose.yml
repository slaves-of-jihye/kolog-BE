name: kolog_backend

services:
  kolog_backend:
    build:
      context: ${BUILD_CONTEXT:-..}
      dockerfile: deploy/Dockerfile
    image: kolog_backend:${IMAGE_TAG:?IMAGE_TAG must be set to an immutable build tag}
    container_name: kolog_backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?DB_URL must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FILE_UPLOAD_DIR: ${FILE_UPLOAD_DIR:-/app/storage/}
      FILE_SERVER_URL: ${FILE_SERVER_URL:?FILE_SERVER_URL must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      HIBERNATE_FORMAT_SQL: ${HIBERNATE_FORMAT_SQL:-false}
      HIBERNATE_HIGHLIGHT_SQL: ${HIBERNATE_HIGHLIGHT_SQL:-false}
    ports:
      - "${APP_PORT:-8001}:8080"
    volumes:
      - kolog_backend_storage_data:/app/storage
    networks:
      - kolog_backend_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/v1/logs/hours"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

networks:
  kolog_backend_network:
    name: kolog_backend_network
    driver: bridge

volumes:
  kolog_backend_storage_data:
    name: kolog_backend_storage_data
