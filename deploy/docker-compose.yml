services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kolog-be:latest
    container_name: kolog-be
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8001:8080"
    volumes:
      - kolog-storage:/app/storage
    networks:
      - kolog-network

networks:
  kolog-network:
    driver: bridge

volumes:
  kolog-storage:
