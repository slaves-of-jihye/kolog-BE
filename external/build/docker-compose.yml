services:
  kolog-backend:
    build:
      context: ../..
      dockerfile: external/build/Dockerfile
    image: kolog-be:latest
    container_name: kolog-be-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../env/kolog-backend.env
    ports:
      - "${APP_PORT}:8080"
    volumes:
      - kolog-upload-data:/app/uploads
    networks:
      - kolog-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: kolog-be-db
    env_file:
      - ../env/db.env
    volumes:
      - kolog-db-data:/var/lib/postgresql/data
    networks:
      - kolog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  kolog-network:
    driver: bridge

volumes:
  kolog-db-data:
    driver: local
  kolog-upload-data:
    driver: local
