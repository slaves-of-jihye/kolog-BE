# NON_KEYWORDS=HOUR : Log 엔티티의 hour 컬럼 때문. H2 2.x 는 HOUR 를 예약어로 보고
# select l1_0.hour ... 를 거부한다(운영 DB 인 PostgreSQL 에서는 예약어가 아니라 통과).
# 테스트 DB 만의 방언 차이라 여기서 흡수한다.
spring.datasource.url=jdbc:h2:mem:kolog-test;MODE=PostgreSQL;NON_KEYWORDS=HOUR;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false

jwt.secret=test-jwt-secret-must-be-at-least-32-bytes
file.upload-dir=${java.io.tmpdir}/kolog-test-storage/
file.server-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:3000
